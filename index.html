    <!-- Decides before first paint whether the opening intro plays:
         once per browser session, never with reduced motion. -->
    <script>
      (function () {
        var d = document.documentElement, skip = true;
        try {
          skip = !!sessionStorage.getItem('ea-intro-seen') || matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!skip) sessionStorage.setItem('ea-intro-seen', '1');
        } catch (e) {}
        if (skip) d.className += ' intro-skip intro-done';
        else setTimeout(function () { d.className += ' intro-done'; }, 1450);
      })();
    </script>
